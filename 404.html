<!DOCTYPE html>
<html lang="es">

  <link rel="stylesheet" href="/styles.css?v=v2-07" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('pn-theme') || 'dark';

      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
</head>

        <span class="logo-main">Privacidad</span><span class="logo-sep">/</span><span class="logo-sub">news</span>
      </a>
    </div>
  </header>
  <main class="container doc-page">
