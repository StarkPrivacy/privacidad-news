name: Sync Telegram

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fetch latest channel posts
        run: python3 scripts/sync_telegram.py 4
      - name: Commit news and thumbnails if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json images/thumbs
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "sync: noticias de t.me/starkprivacy"
            git push
          fi
